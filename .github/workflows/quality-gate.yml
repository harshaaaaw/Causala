name: quality-gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit pytest pytest-asyncio
          pip install fastapi "uvicorn[standard]" "sqlalchemy[asyncio]" aiosqlite pydantic pyjwt networkx typer slowapi httpx textual rich
          pip install -e ./causala --no-deps
          for p in packages/ragforge; do
            if [ -f "$p/pyproject.toml" ]; then pip install -e "./$p" --no-deps || true; fi
          done
      - name: Ruff
        run: ruff check causala/src packages --config causala/pyproject.toml
      - name: Mypy
        run: mypy causala/src/causa --config-file causala/pyproject.toml --ignore-missing-imports --no-error-summary
      - name: Bandit
        run: bandit -r causala/src/causa packages/ragforge/src -q --severity-level medium --confidence-level medium
      - name: Tests
        run: pytest causala/tests packages/ragforge/tests -q
