name: quality-gate

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy[asyncio] aiosqlite pydantic pyjwt networkx typer slowapi httpx textual rich
          pip install ruff mypy bandit pytest pytest-asyncio
          for p in causala packages/ragforge; do
            if [ -f "$p/pyproject.toml" ]; then pip install -e "./$p" --no-deps -q; fi
          done
          if [ -f "packages/ragforge/pyproject.toml" ]; then pip install -e "./packages/ragforge" --no-deps -q; fi
      - name: Ruff
        run: ruff check causala/src packages --config causala/pyproject.toml
      - name: Mypy
        run: mypy . --ignore-missing-imports
      - name: Bandit
        run: bandit -r causala/src/causa packages -q --severity-level medium --confidence-level medium
      - name: Tests
        run: pytest -q
