[project]
name = "causala"
version = "0.3.0"
description = "CAUSALA: the decision twin that proves what your next move will actually cause, with a 90% CI and an audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Deva Harsha Mummareddy" }]
keywords = ["causal-inference", "decision-twin", "ai-governance", "audit-trail", "simulation", "enterprise-ai"]
dependencies = [
    "pydantic>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "networkx>=3.0",
    "PyJWT>=2.8",
    "opentelemetry-api>=1.20",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "slowapi>=0.1.9",
    "httpx>=0.27",
    "textual>=0.44",
    "rich>=13.0",
]

[project.scripts]
causala = "causa.cli:app"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 150

[tool.ruff.lint]
extend-ignore = ["B008", "E501"]
extend-select = ["E", "F", "I", "BLE", "SIM", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
"src/causa/tui/*" = ["BLE001"]
"src/causa/agents/*" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["evalforge", "agent_sentinel", "run_replay", "run_replay.models"]
ignore_missing_imports = true
allow_untyped_defs = true
[[tool.mypy.overrides]]
module = ["causa.*"]
disable_error_code = ["valid-type", "misc", "return-value", "arg-type", "assignment", "index", "union-attr"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
