<svg width="88" height="88" viewBox="0 0 88 88" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CAUSALA mark">
  <!-- Premium twin mark. No gradients. No text. Geometric. Scales to 16px. -->
  <!-- Twin circles -->
  <g fill="none" stroke="#0a0a0a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="36.5" cy="44" r="14.5"/>
    <circle cx="51.5" cy="44" r="14.5"/>
  </g>
  <!-- Honest band: single amber dot at intersection -->
  <circle cx="44" cy="44" r="2.8" fill="#f59e0b" stroke="none"/>
  <!-- Causal direction: minimal chevron -->
  <path d="M 62 44 L 66.5 44" stroke="#0a0a0a" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M 64.5 41.5 L 67 44 L 64.5 46.5" fill="none" stroke="#0a0a0a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Wordmark -->
  <text x="44" y="72" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Helvetica, Arial" font-size="10.5" font-weight="650" letter-spacing="0.14em" fill="#0a0a0a">CAUSALA</text>
</svg>
